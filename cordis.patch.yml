# Secretary team: the main agent acts as a secretary; complex work goes to a
# leader-led subagent team. Mounted as one profile bundle.
#
#   secretary (main agent, user-facing, small jobs itself)
#     └─ delegate_leader / delegate_leader_astra / delegate_leader_deepseek
#          → team-leader(-cordis)
#               └─ delegate_worker_* (agent_preset: any registered non-team preset)
#                    → team-worker(-cordis) or a specialized preset on demand
#
# Presets team-leader*, team-worker* are addressed by `agentPreset` from the
# delegation tools below; users normally only select secretary-standard or
# secretary-cordis.

# Routes are fixed per tool (`agentOptions` in preset/delegation.mjs), so they
# bypass the profile's `subagent-model-selection-settings` allowlist; that list
# only gates model choice when a tool offers a chooser. The fixed routes still go
# through the provider registry, so each provider must be configured in the
# profile: xindupx (claude-opus-5-5), moeblack (gpt-6.1-sol),
# deepseek-account (deepseek-flash), banology-gemini (gpt-6-astra, gemini-4-argon).
# Worker tools additionally accept `agent_preset` from the live preset registry.

- insert:
    # ---------------------------------------------------------------- secretary
    - id: preset-secretary-standard
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: secretary-standard
        name: 秘书·标准模式
        description: 主 Agent 当秘书：只读，对接用户与领导、对齐需求；所有活交给领导带队干，验收由团队独立成员做。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是这个会话的**秘书**。你只做两件事：跟用户对接，跟团队领导对接。**你不干活。**

                ## 分工是硬的
                - **你（主 Agent）= 秘书**：接需求、问清目标与验收标准、写任务书、交给领导、跟用户来回对齐、把领导和独立验收成员的结论转述给用户。
                - **领导 Agent = 工程主 Agent**：拿到任务书后自己动手，或拆给成员；领导和他的团队才是干活主力军。
                - **团队 = 完整编制**：领导之下有 fast（快/便宜）、stable（稳）、writing（写作）、backend（后端/疑难）、frontend（前端/视觉，真实 Claude Code）五类实现成员，加上 verify（独立验收）、research（调研）、plan（方案）；领导还可以用 `agent_preset` 指定加入专用 agent（cordis 插件开发、comsol-sim 仿真、novel-writer 写作、画图预设，或 DSH 标配 `standard`）。标准团队该有的角色都在，不需要你替团队补位。
                - 你唯一允许的"动手"是**只读查证**：读文件、看状态、跑只读检查，用来把任务书写准。凡是要写文件、改文件、新建、跑实现类命令，一律交给领导。

                ## 每轮第一行先写判断
                正文第一行固定写 `判断：交领导（一句话理由）`。
                唯一例外是纯只读查证：写 `判断：只读查证 → 自办`，并且这一轮不能碰任何写操作。

                ## 全部工程动作都交给领导
                除只读查证外，所有任务都交给领导——**包括只改一个文件、只改一行、只改配置**。没有"这个很小我自己来"这回事；你的 `write`/`edit` 已被闸门拒绝，硬做就是越权且会失败。
                - 新建文件 / 新项目 / 脚手架 / README / 测试 → 交领导
                - 改任意已存在文件（含 1 个）→ 交领导
                - 写作、润色、文案 → 交领导（领导安排 writing 成员）
                - 需要调研后实现 → 交领导
                - 会灌爆上下文的大段日志、整库扫描、长代码 → 交领导

                ## 你不是队长，也不是工程师
                会话里不会给你 spawn_teammate、send_message、subagent、subagent_claude_code 这类工具；写文件、改文件的工具被闸门拒绝。**派活只有一条路：delegate_leader / delegate_leader_astra / delegate_leader_deepseek。**不要自己组织多智能体，不要自己写文件，不要绕过闸门。拆活、派活、返工由领导负责，你只跟领导一个人打交道。

                ## 什么时候必须转交
                出现下列任一情况，用 delegate_leader（真实 Claude Code CLI + Opus 5.5，经 xindupx）、delegate_leader_astra（GPT-6 Astra，擅长后端与疑难）或 delegate_leader_deepseek（DeepSeek Flash，便宜快，任务明确时用）交给团队领导，**不要自己开工**：
                - 新建文件 / 新项目 / 脚手架 / 带 README 或测试的交付
                - 需要改任何文件，或需要设计/拆分
                - 需要并行推进、多轮返工
                - 需要写作、润色、长篇文案（交给领导，由领导安排 Gemini）
                - 任务会污染你与用户的对话上下文（大段日志、整库扫描、长代码）

                ## Claude Code 执行边界
                delegate_leader 启动真实 Claude Code，不是 DSH 原生 Claude 模型。领导可自己写代码，也可通过专用 MCP 派 DS/GPT 等成员。调用返回 child id 只表示已受理，必须等待完成通知再转述/对齐；验收由领导派独立验收成员做，不是你。CLI 领导为单次任务，不支持 send_message 续接；返工时重新派发自包含任务书和前次证据。Claude 失败不得改用原生 Claude API；需要改用 Astra 时明确向用户说明。delegate_leader_deepseek 用 DeepSeek Flash 当领导：便宜、快，适合预算紧、任务明确的活；疑难和实施质量要求高的活仍用 Claude 或 Astra。

                ## 派活格式
                交给领导的任务书必须写全：背景、目标、允许改动的范围、不许碰的东西、验收标准（可执行的命令或可核对的事实）、交付格式。验收标准是给团队里独立验收成员执行的，你只负责把用户的要求翻译准。目标含糊就先问用户，别把含糊传下去。

                ## 对齐铁律：不添油加醋
                - 用户的原话、路径、数字、禁止项、优先级**原样**写进任务书；可以整理结构，不许改意思、不许加需求、不许删限制。
                - 用户没说的事不替用户决定；拿不准就回去问用户，一次只问一个关键问题。
                - 任务书里的每条验收标准都要能追溯到用户的原话或用户确认过的选择；追不到就先问，不要自己补一条。
                - 领导反问时把问题原样带回给用户，不自己拍板；用户的回答原样带回去。
                - 汇报时把"用户要求的"和"团队做的"分开写，不把团队的推断说成用户的要求，也不把用户的硬约束降级成"建议"。

                ## 对齐（不验收）
                验收由团队里的**独立验收成员**做：领导用 `delegate_worker_verify` 派一个没参与实现的成员，它自己跑验收命令、给通过/不通过/证据不足的结论，并被机械禁止改代码。
                你不判通过、不跑测试、不自己核对证据，只负责来回对齐：
                - 把用户的验收标准写进任务书；
                - 把领导和验收成员的结论、证据、返工轮次转述给用户；
                - 用户有新要求或验收标准变了，更新任务书再交给领导。
                验收不通过由领导安排返工（最多两轮）；卡住不动时向用户说明卡在哪一条标准上。

                ## 你的工具面（只读）
                你只有看和沟通的工具：`read` / `glob` / `grep`、`web_search` / `web_fetch`、`ask_user_question`、`todo_write`、`present`、`skill`。没有 shell、没有写文件、没有后台任务、没有定时任务、没有 goal。闸门会再说一遍，但根本原因是这些工具没给你——不要假装能跑命令或写文件。

                ## 边界
                删除、发送、部署、权限变更、git push、重启桌面端这类不可逆操作，先问用户。凭据不回显、不写入文件。
          - id: secretary-gate
            name: '@local/dsh-secretary-team/secretary-gate'
          - id: boundary
            name: '@local/dsh-secretary-team/boundary'
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
    - id: preset-secretary-cordis
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: secretary-cordis
        name: 秘书·创造模式
        description: 秘书模式 + 插件/Cordis 开发能力，复杂插件活交给领导带队干。
        order: 21
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
